server {
    listen 80;
    server_name _;

    types { }
    default_type text/plain;

    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    location = / {
        return 200 "HSPACE LiveFire CLI/API gateway\n\nhealth:\n  curl -fsS http://knights.hspace.io:42000/health\n\nscore JSON:\n  curl -fsS http://knights.hspace.io:42000/scoreboard | python3 -m json.tool\n\nparticipant bundle:\n  curl -fLO http://knights.hspace.io:42000/deploy-bundle.tar.gz\n\nnotice:\n  curl -fsS http://knights.hspace.io:42000/deploy/DISCORD_NOTICE.txt\n";
    }

    location = /health {
        proxy_pass http://coordinator:9000;
    }

    location = /deploy-bundle.tar.gz {
        alias /srv/dist/hspace-livefire-user-deploy.tar.gz;
        default_type application/gzip;
    }

    location = /deploy/ {
        return 200 "CLI-only deploy endpoint. Use:\n  curl -fLO http://knights.hspace.io:42000/deploy-bundle.tar.gz\n  curl -fsS http://knights.hspace.io:42000/deploy/DISCORD_NOTICE.txt\n";
    }

    location /deploy/ {
        alias /srv/user_deploy/;
        charset utf-8;
        try_files $uri =404;
    }

    location = /scoreboard {
        proxy_pass http://coordinator:9000;
    }

    location = /status {
        proxy_pass http://coordinator:9000;
    }

    location = /history {
        proxy_pass http://coordinator:9000;
    }

    location /admin/ {
        proxy_pass http://coordinator:9000;
    }

    location /agent/ {
        proxy_pass http://coordinator:9000;
    }

    location = /agent-runs {
        proxy_pass http://coordinator:9000;
    }

    location /agent-runs/ {
        proxy_pass http://coordinator:9000;
    }

    location /tools/ {
        proxy_pass http://coordinator:9000;
    }

    location /git/ {
        proxy_request_buffering off;
        proxy_pass http://coordinator:9000;
    }

    location /attack {
        proxy_pass http://coordinator:9000;
    }

    location /llm {
        proxy_pass http://coordinator:9000;
    }

    location /openrouter/ {
        proxy_pass http://coordinator:9000;
    }

    location /v1/ {
        proxy_pass http://coordinator:9000;
    }

    location /pocs {
        proxy_pass http://coordinator:9000;
    }

    location / {
        return 404 "not found\n";
    }
}

