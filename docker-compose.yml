# ── 네트워크 ────────────────────────────────────────────────────────────
# scoring-net : gateway/coordinator 전용 관리 플레인 (팀 서비스는 진입 불가)
# target-net  : 팀 서비스 6개 (coordinator가 공격 라우팅용으로 접근)
#
# 공격 에이전트 컨테이너는 agent_runner.py가 docker run 으로 직접 띄우며
# scoring-net 에만 연결 → /attack 호출 가능, 타겟 서비스 직접 접근 불가
networks:
  scoring-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "10.89.20.0/24"
  target-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: "10.89.21.0/24"
  egress-net:
    driver: bridge

x-team-service-base: &team-service-base
  profiles:
    - mock
  build: ./web_service
  environment:
    - CHECKER_TOKEN=${CHECKER_TOKEN:-checker-token-changeme}
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: "1G"

services:

  # ── Public Scoreboard / CLI Gateway ─────────────────────────────────
  # 외부 공개 42000은 점수판과 참가자 CLI 제출에 필요한 최소 API를 제공한다.
  # 참가자 배포 문서/번들 같은 정적 파일은 이 포트에 마운트하지 않는다.
  gateway:
    image: nginx:alpine
    depends_on:
      - coordinator
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./scoreboard:/srv/scoreboard:ro
    ports:
      - "42000:80"
      - "42001:42001"
      - "42002:42002"
      - "42003:42003"
      - "42004:42004"
      - "42005:42005"
      - "42006:42006"
    networks:
      scoring-net:
        ipv4_address: 10.89.20.3
      target-net:
        ipv4_address: 10.89.21.3
      egress-net: {}
    restart: unless-stopped

  # ── Coordinator ───────────────────────────────────────────────────────
  coordinator:
    build: ./coordinator
    networks:
      scoring-net:
        ipv4_address: 10.89.20.2
      target-net:
        ipv4_address: 10.89.21.2    # 팀 서비스로 아웃바운드 전용
      egress-net: {}                 # OpenRouter egress 전용
    expose:
      - "9000"                       # gateway/agent 내부 접근 전용
    env_file: ./coordinator/.env
    environment:
      - COORDINATOR_URL=http://10.89.20.2:9000
      - REPOS_DIR=/app/repos
      - VULN_SPEC_DIR=/app/vuln_specs
      - DB_PATH=/app/data/game_state.db
      - DATA_DIR=/app/data
      - ATTACK_DOCKER_NETWORK=hackathon_scoring-net
      - POC_RUNNER_MODE=docker
      - POC_DOCKER_NETWORK=hackathon_target-net
      - POC_DOCKER_IMAGE=python:3.11-slim
      - POC_HOST_DATA_DIR=${PWD}/data
    volumes:
      - ./vuln_specs:/app/vuln_specs                    # post-receive에서 teamX.json 추출
      - ./repos:/app/repos                              # git bare repos
      - ./data:/app/data                                # PoC 제출/실행 결과
      - ./scripts:/app/tools:ro                         # 참가자 helper 최신본 배포
      - /var/run/docker.sock:/var/run/docker.sock        # 에이전트 컨테이너 실행용
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  # ── Team Services ───────────────────────────────────────────────────
  # 각 팀 서비스는 target-net에만 연결 — coordinator admin 포트 도달 불가.
  # 외부 팀 포트는 서비스별로 1개씩만 공개한다.
  team1-service:
    <<: *team-service-base
    networks:
      target-net:
        ipv4_address: 10.89.21.10

  team2-service:
    <<: *team-service-base
    networks:
      target-net:
        ipv4_address: 10.89.21.11

  team3-service:
    <<: *team-service-base
    networks:
      target-net:
        ipv4_address: 10.89.21.12

  team4-service:
    <<: *team-service-base
    networks:
      target-net:
        ipv4_address: 10.89.21.13

  team5-service:
    <<: *team-service-base
    networks:
      target-net:
        ipv4_address: 10.89.21.14

  team6-service:
    <<: *team-service-base
    networks:
      target-net:
        ipv4_address: 10.89.21.15
